<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aqua Luna · 수련 아트 카탈로그</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1822;color:#d5e8e3;font:16px/1.7 system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:32px}h1{font-size:34px;margin:0}p{color:#adbec3}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:9px 16px;border:1px solid #657d84;background:#182c39;color:inherit;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#c1ded7;color:#112633}label{display:inline-flex;gap:12px;align-items:center;margin-right:28px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}article{background:#172a35;padding:16px;border:1px solid #334950;border-radius:8px}article[hidden]{display:none}figure{margin:0;background:var(--preview,#203540);height:390px;display:flex;align-items:center;justify-content:center}figure img{width:100%;height:100%;object-fit:contain}article[data-group="액세서리"] figure{height:260px}article[data-group="배경"] figure{height:220px}h2{font-size:18px;margin:14px 0 4px}a{color:#b8dcdb}small{color:#adbec3}input{width:20px;height:20px}footer{padding:32px}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #efd0a4;outline-offset:4px}
</style><script src="../src/data.js"></script></head><body><header><small>AQUA LUNA / ART COLLECTION</small><h1>수련의 하루를 만드는 그림들</h1><p>전신 스타일 14종 · 포즈와 표정 6종 · 액세서리 23종 · 실내 배경 2종</p><nav aria-label="이미지 종류" id="filters"></nav><label><input type="checkbox" id="headset">헤드셋 착용 모습</label><label>미리보기 배경<select id="background"><option value="#203540">밤</option><option value="#e0e2dd">낮</option><option value="repeating-conic-gradient(#bbb 0% 25%,#eee 0% 50%) 0 / 24px 24px">투명도 격자</option></select></label><p><a href="https://www.figma.com/design/1RXvK2xXHu7Zk5OjJBtSBE">Figma 보드</a> · <a href="../reports/FASHION_RESEARCH_2026-10-11.md">조사와 제작 기록</a> · <a href="../index.html">게임 열기</a></p></header><main><div id="grid"></div></main><footer>헤드셋은 게임에서 기본 보유하며 자유롭게 착용·해제합니다. 나머지 신규 소품은 개별 PNG 아트이며 독립 장착 기능은 포함하지 않습니다.</footer><script>
const assets=[{"id": "casual", "name": "차콜 후드", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/casual.png"}, {"id": "knit", "name": "아이보리 니트", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/knit.png"}, {"id": "coat", "name": "네이비 코트", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/coat.png"}, {"id": "skirt", "name": "가디건·플리츠", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/skirt.png"}, {"id": "shirt", "name": "하늘빛 셔츠", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/shirt.png"}, {"id": "blouse", "name": "라벤더 블라우스", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/blouse.png"}, {"id": "mini-pleats", "name": "버건디 미니 플리츠", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/mini-pleats.png"}, {"id": "denim-mini", "name": "데님 미니", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/denim-mini.png"}, {"id": "suede-mini", "name": "스웨이드 재킷", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/suede-mini.png"}, {"id": "bubble-mini", "name": "더스티 핑크 버블", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/bubble-mini.png"}, {"id": "layered-denim", "name": "레이어드 와이드 데님", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/layered-denim.png"}, {"id": "quarter-bermuda", "name": "쿼터집 버뮤다", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/quarter-bermuda.png"}, {"id": "satin-midi", "name": "블루 새틴 미디", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/satin-midi.png"}, {"id": "utility-cargo", "name": "시티 카고", "group": "전신 스타일", "path": "assets/characters/fullbody-no-headset/utility-cargo.png"}, {"id": "warm-smile", "name": "반가운 미소", "group": "포즈와 표정", "path": "assets/characters/poses-no-headset/warm-smile.png"}, {"id": "shy", "name": "수줍은 고백", "group": "포즈와 표정", "path": "assets/characters/poses-no-headset/shy.png"}, {"id": "surprised", "name": "뜻밖의 만남", "group": "포즈와 표정", "path": "assets/characters/poses-no-headset/surprised.png"}, {"id": "worried", "name": "걱정과 위로", "group": "포즈와 표정", "path": "assets/characters/poses-no-headset/worried.png"}, {"id": "playful", "name": "장난스러운 초대", "group": "포즈와 표정", "path": "assets/characters/poses-no-headset/playful.png"}, {"id": "thoughtful", "name": "생각에 잠긴 오후", "group": "포즈와 표정", "path": "assets/characters/poses-no-headset/thoughtful.png"}, {"id": "scrunchie", "name": "새틴 스크런치", "group": "액세서리", "path": "assets/accessories/20261007/scrunchie.png"}, {"id": "ribbon", "name": "아이보리 리본", "group": "액세서리", "path": "assets/accessories/20261007/ribbon.png"}, {"id": "claw-clip", "name": "실버 집게핀", "group": "액세서리", "path": "assets/accessories/20261007/claw-clip.png"}, {"id": "barrette", "name": "토터스 헤어핀", "group": "액세서리", "path": "assets/accessories/20261007/barrette.png"}, {"id": "huggie-earrings", "name": "실버 링 귀걸이", "group": "액세서리", "path": "assets/accessories/20261007/huggie-earrings.png"}, {"id": "ear-cuff", "name": "실버 이어커프", "group": "액세서리", "path": "assets/accessories/20261007/ear-cuff.png"}, {"id": "pearl-earrings", "name": "진주 귀걸이", "group": "액세서리", "path": "assets/accessories/20261007/pearl-earrings.png"}, {"id": "moon-necklace", "name": "달 펜던트 목걸이", "group": "액세서리", "path": "assets/accessories/20261007/moon-necklace.png"}, {"id": "pearl-necklace", "name": "짧은 진주 목걸이", "group": "액세서리", "path": "assets/accessories/20261007/pearl-necklace.png"}, {"id": "chain-bracelet", "name": "실버 체인 팔찌", "group": "액세서리", "path": "assets/accessories/20261007/chain-bracelet.png"}, {"id": "stack-rings", "name": "레이어드 반지", "group": "액세서리", "path": "assets/accessories/20261007/stack-rings.png"}, {"id": "watch", "name": "가죽 스트랩 시계", "group": "액세서리", "path": "assets/accessories/20261007/watch.png"}, {"id": "silk-scarf", "name": "슬림 실크 스카프", "group": "액세서리", "path": "assets/accessories/20261007/silk-scarf.png"}, {"id": "leaf-brooch", "name": "은빛 잎 브로치", "group": "액세서리", "path": "assets/accessories/20261007/leaf-brooch.png"}, {"id": "slim-belt", "name": "슬림 블랙 벨트", "group": "액세서리", "path": "assets/accessories/20261007/slim-belt.png"}, {"id": "oval-glasses", "name": "실버 타원 안경", "group": "액세서리", "path": "assets/accessories/20261007/oval-glasses.png"}, {"id": "beret", "name": "차콜 울 베레모", "group": "액세서리", "path": "assets/accessories/20261007/beret.png"}, {"id": "cap", "name": "슬레이트 볼캡", "group": "액세서리", "path": "assets/accessories/20261007/cap.png"}, {"id": "shoulder-bag", "name": "스웨이드 숄더백", "group": "액세서리", "path": "assets/accessories/20261007/shoulder-bag.png"}, {"id": "canvas-tote", "name": "크림 캔버스 토트", "group": "액세서리", "path": "assets/accessories/20261007/canvas-tote.png"}, {"id": "nylon-crossbody", "name": "나일론 크로스백", "group": "액세서리", "path": "assets/accessories/20261007/nylon-crossbody.png"}, {"id": "moon-charm", "name": "달빛 키링", "group": "액세서리", "path": "assets/accessories/20261007/moon-charm.png"}, {"id": "headset", "name": "수련의 헤드셋", "group": "액세서리", "path": "assets/accessories/20261007/headset.png"}, {"id": "room", "name": "수련의 방 · 일정과 옷장", "group": "배경", "path": "assets/environment/sulien-room.png"}, {"id": "fitting", "name": "피팅 공간 · 의상 상점", "group": "배경", "path": "assets/environment/wardrobe-fitting.png"}];const grid=document.getElementById('grid');let selected='전체';
for(const group of ['전체','전신 스타일','포즈와 표정','액세서리','배경']){const b=document.createElement('button');b.textContent=group;b.setAttribute('aria-pressed',group===selected);b.onclick=()=>{selected=group;document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',x.textContent===group));draw();};document.getElementById('filters').append(b);}
function draw(){grid.replaceChildren();const on=document.getElementById('headset').checked;for(const a of assets){if(selected!=='전체'&&a.group!==selected)continue;let path=a.path;if(a.group==='전신 스타일')path=LunaData.characterImage(a.id,'none','neutral',on?'headset':'none');if(a.group==='포즈와 표정')path=LunaData.characterImage('casual','none',a.id==='warm-smile'?'smile':a.id,on?'headset':'none');const card=document.createElement('article');card.dataset.group=a.group;const figure=document.createElement('figure'),img=document.createElement('img');img.src='../'+path;img.alt=a.name;img.loading='lazy';figure.append(img);const title=document.createElement('h2');title.textContent=a.name;const link=document.createElement('a');link.href=img.src;link.textContent='PNG 원본 열기';link.target='_blank';link.rel='noopener';card.append(figure,title,link);grid.append(card);}}
document.getElementById('headset').onchange=draw;document.getElementById('background').onchange=e=>document.documentElement.style.setProperty('--preview',e.target.value);draw();
</script></body></html>
